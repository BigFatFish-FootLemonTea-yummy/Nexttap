# Nginx 配置：同域反代，前端与后端共用 80 端口
#
# 为什么不分成两个域名：分域必然引入 CORS 与 Cookie 调试成本，
# 同域下前端只写相对路径 /api，不需要任何跨域配置。

server {
    listen 80;
    server_name _;

    # 截图上传最大 8MB（与后端 MAX_UPLOAD_MB 对齐），留 2MB 余量给 multipart 开销
    client_max_body_size 10m;

    # 手机拍的照片可能很大，交给前端压缩，但 nginx 也要放宽超时
    client_body_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：/result、/show 这些前端路由要回落到 index.html，
    # 否则刷新页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存：Vite 产物带 hash，可以放心 cache 一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反代到后端容器（docker-compose 里的服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 定位单次 p50 约 2.7s、p90 约 4.0s，给 120s 足够
        # 但不能太短：OCR 冷启动 + 模型调用可能叠加到 15s
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 关掉缓冲，等待提示能实时出来
        proxy_buffering off;
    }

    # 健康检查也转发，方便运维直接 curl
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # gzip：JS/CSS 能压到 1/3 以下，移动网络下差别明显
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
